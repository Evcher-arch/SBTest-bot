[project]
name = "tg-bot"
version = "0.1.0"
description = "Telegram-бот: роли, диалог, кнопки, приём уведомлений"
requires-python = ">=3.12,<3.13"
dependencies = [
    "common",
    "aiogram>=3.31,<4",
    "fastapi>=0.162,<1",
    "uvicorn>=0.54,<1",
    "httpx>=0.28,<0.29",
    "aiohttp-socks>=0.10",
    "redis>=8.1,<9",
]

[tool.uv]
package = false

[tool.uv.sources]
common = { workspace = true }
