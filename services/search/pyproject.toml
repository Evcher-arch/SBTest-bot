[project]
name = "search"
version = "0.1.0"
description = "Поиск по регламентам: индексатор, нарезка, эмбеддинги, гибридный поиск"
requires-python = ">=3.12,<3.13"
dependencies = [
    "common",
    "fastapi>=0.162,<1",
    "uvicorn>=0.54,<1",
    "openai>=3.50,<4",
    "SQLAlchemy[asyncio]>=2.1,<3",
    "asyncpg>=0.32,<0.33",
    "pgvector>=0.5,<0.6",
    "APScheduler>=3.11,<4",
    "httpx>=0.28,<0.29",
]

[tool.uv]
package = false

[tool.uv.sources]
common = { workspace = true }
