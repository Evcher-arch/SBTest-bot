[project]
name = "orchestrator"
version = "0.1.0"
description = "Оркестратор: цикл агента, инструменты, черновики, Langfuse"
requires-python = ">=3.12,<3.13"
dependencies = [
    "common",
    "fastapi>=0.162,<1",
    "uvicorn>=0.54,<1",
    "openai>=3.50,<4",
    "langfuse>=5.2,<6",
    "fastmcp>=3.0,<4",
    "SQLAlchemy[asyncio]>=2.1,<3",
    "asyncpg>=0.32,<0.33",
    "redis>=8.1,<9",
    "jsonschema>=4.26,<5",
    "httpx>=0.28,<0.29",
]

[tool.uv]
package = false

[tool.uv.sources]
common = { workspace = true }
