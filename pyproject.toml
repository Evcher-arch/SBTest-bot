[project]
name = "demo-stand"
version = "0.1.0"
description = "Демо-стенд ИИ-помощника по внутренним процессам"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/common", "services/*"]

[dependency-groups]
dev = [
    "pytest>=9.2,<10",
    "pytest-asyncio>=1.5,<2",
    "respx>=0.23,<0.24",
    "ruff>=0.17,<0.18",
    "fakeredis>=2.40,<3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]
