[project]
name = "common"
version = "0.1.0"
description = "Общий код стенда: настройки, JWT, ошибки, схемы, логирование, справочник сотрудников"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162,<1",
    "httpx>=0.28,<0.29",
    "PyJWT>=2.15,<3",
    "PyYAML>=6.0,<7",
    "redis>=8.1,<9",
    "tzdata>=2025.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common"]
